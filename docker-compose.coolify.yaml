# Deployed by Coolify as this repo's docker_compose_location. Differs from
# docker-compose.yaml only in the network: joins the pre-existing external `coolify` network
# so other tenant apps can reach this container by service name (`valkey`). Never gets a
# public domain — see README for the docker_compose_domains suppression step.
services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_REQUIREPASS:?VALKEY_REQUIREPASS must be set}", "--appendonly", "yes"]
    environment:
      VALKEY_REQUIREPASS: ${VALKEY_REQUIREPASS:?VALKEY_REQUIREPASS must be set}
    volumes:
      - valkey-data:/data
    networks:
      - coolify
    # Security hardening (OWASP Docker Security Cheat Sheet). Verified against a real
    # throwaway container (fresh init, SET/GET/ACL SETUSER, restart against existing data)
    # before landing:
    # - cap_drop: ALL — valkey's own process needs no special Linux capabilities to serve
    #   traffic or write to its volume/tmpfs.
    # - read_only + tmpfs /tmp: /data (the real data, incl. the appendonly file) is already a
    #   named volume so it stays writable regardless of read_only; valkey needs nothing else
    #   writable in normal operation.
    # - user: "999:1000" (valkey:valkey, baked into the image) — the image's entrypoint drops
    #   from root to this user via `setpriv`, which needs SETUID/SETGID; cap_drop: ALL removes
    #   those, so the container must start as this user directly instead. /data is already
    #   valkey-owned and world-writable (1777) in the image, so this works against a fresh
    #   named volume with no extra chown step.
    user: "999:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_REQUIREPASS\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  valkey-data:

networks:
  coolify:
    external: true
